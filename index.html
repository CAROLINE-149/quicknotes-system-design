```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes API client for creating and managing notes.">
    <title>QuickNotes | Notes Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>QuickNotes</h1>
            <p>Your simple space for capturing ideas.</p>
        </div>
    </header>

    <main class="container">
        <section class="notes-section">
            <div class="section-heading">
                <div>
                    <h2>Your Notes</h2>
                    <p>Load notes from the server or create a new one.</p>
                </div>
                <button type="button" id="load-btn">Load notes</button>
            </div>

            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to get started.
            </p>

            <form id="note-form">
                <h3>Create a note</h3>

                <div class="form-group">
                    <label for="title-input">Title</label>
                    <input
                        type="text"
                        id="title-input"
                        name="title"
                        maxlength="100"
                        required
                        placeholder="Enter your note title"
                    >
                    <small>Required · Maximum 100 characters</small>
                </div>

                <div class="form-group">
                    <label for="body-input">Note body (optional)</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="4"
                        placeholder="Write your thoughts here..."
                    ></textarea>
                </div>

                <button type="submit" id="submit-btn">Create note</button>
            </form>

            <ul id="notes-list" aria-label="Notes list"></ul>
        </section>
    </main>

    <footer class="footer">
        <p>QuickNotes &copy; 2026 · API practice project</p>
    </footer>
</body>
</html>
```
